<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#141428"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="100%" stop-color="#7B5CFF"/>
    </linearGradient>
    <style>
      .mono { font-family: 'Fira Code','Consolas',monospace; }
      .sans { font-family: 'Poppins','Segoe UI',sans-serif; }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="318" rx="14" fill="url(#bg)" stroke="url(#border)" stroke-width="2"/>

  <!-- terminal dots -->
  <circle cx="30" cy="30" r="6" fill="#FF5F56"/>
  <circle cx="52" cy="30" r="6" fill="#FFBD2E"/>
  <circle cx="74" cy="30" r="6" fill="#27C93F"/>
  <text x="450" y="35" text-anchor="middle" class="mono" font-size="13" fill="#6b7280">prathik@fullstack-dev: ~</text>

  <!-- left column: greeting -->
  <text x="40" y="80" class="mono" font-size="15" fill="#00F7FF">$ whoami</text>
  <text x="40" y="120" class="sans" font-size="34" font-weight="700" fill="#ffffff">Hi, I'm Prathik 👋</text>
  <text x="40" y="150" class="sans" font-size="17" fill="#9CA3AF">Aspiring Application Developer</text>

  <!-- tech pills -->
  <g class="mono" font-size="13" font-weight="600">
    <rect x="40" y="170" width="60" height="26" rx="13" fill="#0f2027" stroke="#00F7FF"/>
    <text x="70" y="187" text-anchor="middle" fill="#00F7FF">React</text>

    <rect x="108" y="170" width="55" height="26" rx="13" fill="#1a1030" stroke="#7B5CFF"/>
    <text x="135" y="187" text-anchor="middle" fill="#B9A6FF">Flask</text>

    <rect x="171" y="170" width="65" height="26" rx="13" fill="#0f2027" stroke="#00F7FF"/>
    <text x="203" y="187" text-anchor="middle" fill="#00F7FF">Django</text>

    <rect x="244" y="170" width="70" height="26" rx="13" fill="#1a1030" stroke="#7B5CFF"/>
    <text x="279" y="187" text-anchor="middle" fill="#B9A6FF">Node.js</text>

    <rect x="322" y="170" width="70" height="26" rx="13" fill="#0f2027" stroke="#00F7FF"/>
    <text x="357" y="187" text-anchor="middle" fill="#00F7FF">Next.js</text>
  </g>

  <text x="40" y="230" class="mono" font-size="13" fill="#6b7280">// "Every feature ships, every bug gets fixed."</text>

  <text x="40" y="270" class="mono" font-size="13" fill="#4b5563">Repos: 10+   Commits: 300+   Streak: 8 days</text>

  <!-- right column: code block -->
  <rect x="470" y="55" width="390" height="220" rx="10" fill="#0a0a14" stroke="#2a2a40"/>
  <text x="490" y="80" class="mono" font-size="12" fill="#6b7280">build.js</text>
  <g class="mono" font-size="13">
    <text x="490" y="105" fill="#C792EA">function <tspan fill="#82AAFF">buildProject</tspan>() {</text>
    <text x="510" y="128" fill="#89DDFF">return (</text>
    <text x="530" y="151" fill="#F78C6C">&lt;<tspan fill="#FF5FA2">Stack</tspan>&gt;</text>
    <text x="550" y="174" fill="#C3E88D">&lt;React /&gt;</text>
    <text x="550" y="197" fill="#C3E88D">&lt;Flask /&gt;</text>
    <text x="550" y="220" fill="#C3E88D">&lt;MongoDB /&gt;</text>
    <text x="530" y="243" fill="#F78C6C">&lt;/<tspan fill="#FF5FA2">Stack</tspan>&gt;</text>
    <text x="510" y="266" fill="#89DDFF">);</text>
  </g>
</svg>
